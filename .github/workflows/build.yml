name: Build MultiMeter (Windows x64)
on: {push: {}, workflow_dispatch: {}}
jobs: {windows: {runs-on: windows-latest, steps: [{uses: actions/checkout@v4}, {name: Configurar, run: 'cmake -B build -G "Visual Studio 17 2022" -A x64'}, {name: "Compilar VST3", run: "cmake --build build --config Release --target MultiMeter_VST3 --parallel"}, {name: Instalador, run: 'choco install innosetup -y --no-progress; & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss'}, {uses: actions/upload-artifact@v4, with: {name: MultiMeter-Setup, path: installer/output/MultiMeter-Setup.exe}}]}}
